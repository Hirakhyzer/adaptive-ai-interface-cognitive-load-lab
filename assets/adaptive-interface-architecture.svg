<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive AI Interface Architecture</title>
  <desc id="desc">Architecture diagram for task context, interaction signals, cognitive load estimation, adaptation policy, and interface outputs.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter, Arial" font-size="34" font-weight="800" fill="#0F172A">Adaptive Interface Architecture</text>
  <text x="70" y="112" font-family="Inter, Arial" font-size="18" fill="#475569">Synthetic HCI pipeline for load-aware explanations, notifications, and interaction support.</text>
  <g font-family="Inter, Arial" filter="url(#shadow)">
    <rect x="70" y="185" width="230" height="120" rx="26" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><text x="100" y="232" font-size="22" font-weight="800" fill="#1D4ED8">Task Context</text><text x="100" y="263" font-size="15" fill="#475569">complexity, urgency</text>
    <rect x="70" y="355" width="230" height="120" rx="26" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/><text x="100" y="402" font-size="22" font-weight="800" fill="#6D28D9">Interaction Signals</text><text x="100" y="433" font-size="15" fill="#475569">hesitation, revisions</text>
    <rect x="390" y="270" width="260" height="130" rx="28" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/><text x="430" y="320" font-size="22" font-weight="800" fill="#0369A1">Load Estimator</text><text x="430" y="352" font-size="15" fill="#475569">low • medium • high</text>
    <rect x="735" y="270" width="250" height="130" rx="28" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/><text x="775" y="320" font-size="22" font-weight="800" fill="#047857">Adaptation Policy</text><text x="775" y="352" font-size="15" fill="#475569">transparent decisions</text>
    <rect x="1060" y="140" width="160" height="80" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/><text x="1085" y="188" font-size="18" font-weight="800" fill="#1D4ED8">Explanation</text>
    <rect x="1060" y="280" width="160" height="80" rx="22" fill="#F5F3FF" stroke="#C4B5FD"/><text x="1080" y="328" font-size="18" font-weight="800" fill="#6D28D9">Interface Mode</text>
    <rect x="1060" y="420" width="160" height="80" rx="22" fill="#ECFDF5" stroke="#BBF7D0"/><text x="1080" y="468" font-size="18" font-weight="800" fill="#047857">Notifications</text>
  </g>
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round"><path d="M300 245H390"/><path d="M300 415H390"/><path d="M650 335H735"/><path d="M985 335C1030 335 1030 180 1060 180"/><path d="M985 335H1060"/><path d="M985 335C1030 335 1030 460 1060 460"/></g>
</svg>