<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Load Workflow</title>
  <desc id="desc">Workflow from scenario definition through cognitive load estimation, interface adaptation, evaluation, and reflective design review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter, Arial" font-size="34" font-weight="800" fill="#0F172A">Cognitive Load-Aware Workflow</text>
  <text x="70" y="110" font-family="Inter, Arial" font-size="18" fill="#475569">A transparent pipeline for adapting interface complexity during controlled HCI experiments.</text>
  <g font-family="Inter, Arial" filter="url(#shadow)">
    <rect x="70" y="205" width="170" height="130" rx="26" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><text x="98" y="256" font-size="18" font-weight="800" fill="#1D4ED8">1. Scenario</text><text x="98" y="287" font-size="14" fill="#475569">task context</text>
    <rect x="290" y="205" width="170" height="130" rx="26" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/><text x="318" y="256" font-size="18" font-weight="800" fill="#6D28D9">2. Signals</text><text x="318" y="287" font-size="14" fill="#475569">synthetic traces</text>
    <rect x="510" y="205" width="170" height="130" rx="26" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/><text x="538" y="256" font-size="18" font-weight="800" fill="#0369A1">3. Estimate</text><text x="538" y="287" font-size="14" fill="#475569">load level</text>
    <rect x="730" y="205" width="170" height="130" rx="26" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/><text x="758" y="256" font-size="18" font-weight="800" fill="#047857">4. Adapt</text><text x="758" y="287" font-size="14" fill="#475569">mode + support</text>
    <rect x="950" y="205" width="170" height="130" rx="26" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/><text x="978" y="256" font-size="18" font-weight="800" fill="#C2410C">5. Evaluate</text><text x="978" y="287" font-size="14" fill="#475569">usability metrics</text>
  </g>
  <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round"><path d="M240 270H290"/><path d="M460 270H510"/><path d="M680 270H730"/><path d="M900 270H950"/></g>
  <g transform="translate(190 408)" font-family="Inter, Arial"><rect width="900" height="60" rx="30" fill="#F8FAFC" stroke="#CBD5E1"/><text x="40" y="38" font-size="18" font-weight="700" fill="#334155">Reflective design review: autonomy, transparency, usefulness, fatigue, and participant control</text></g>
</svg>