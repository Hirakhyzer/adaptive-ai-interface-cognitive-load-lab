<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Usability Evaluation Dashboard</title>
  <desc id="desc">Dashboard mockup for comparing static and adaptive AI interfaces across workload, trust, performance, interruptions, and explanation usefulness.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial" font-size="34" font-weight="800" fill="#0F172A">Usability Evaluation Dashboard</text>
  <text x="64" y="104" font-family="Inter, Arial" font-size="18" fill="#475569">Compare adaptive and static interface conditions in synthetic HCI studies.</text>
  <g font-family="Inter, Arial" filter="url(#shadow)">
    <rect x="64" y="145" width="250" height="115" rx="24" fill="#FFFFFF" stroke="#BFDBFE"/><text x="90" y="187" font-size="15" font-weight="700" fill="#64748B">Task performance</text><text x="90" y="230" font-size="38" font-weight="800" fill="#1D4ED8">+14%</text>
    <rect x="345" y="145" width="250" height="115" rx="24" fill="#FFFFFF" stroke="#C4B5FD"/><text x="371" y="187" font-size="15" font-weight="700" fill="#64748B">Workload reduction</text><text x="371" y="230" font-size="38" font-weight="800" fill="#6D28D9">-21%</text>
    <rect x="626" y="145" width="250" height="115" rx="24" fill="#FFFFFF" stroke="#BBF7D0"/><text x="652" y="187" font-size="15" font-weight="700" fill="#64748B">Trust rating</text><text x="652" y="230" font-size="38" font-weight="800" fill="#047857">4.2/5</text>
    <rect x="907" y="145" width="250" height="115" rx="24" fill="#FFFFFF" stroke="#FED7AA"/><text x="933" y="187" font-size="15" font-weight="700" fill="#64748B">Interrupted tasks</text><text x="933" y="230" font-size="38" font-weight="800" fill="#C2410C">-32%</text>
    <rect x="64" y="310" width="540" height="310" rx="28" fill="#FFFFFF" stroke="#CBD5E1"/><text x="94" y="354" font-size="22" font-weight="800" fill="#0F172A">Condition comparison</text><rect x="110" y="508" width="74" height="72" rx="12" fill="#BFDBFE"/><rect x="205" y="455" width="74" height="125" rx="12" fill="#93C5FD"/><rect x="325" y="485" width="74" height="95" rx="12" fill="#C4B5FD"/><rect x="420" y="426" width="74" height="154" rx="12" fill="#A78BFA"/><text x="112" y="606" font-size="13" fill="#64748B">static</text><text x="204" y="606" font-size="13" fill="#64748B">adaptive</text><text x="322" y="606" font-size="13" fill="#64748B">static</text><text x="418" y="606" font-size="13" fill="#64748B">adaptive</text>
    <rect x="650" y="310" width="510" height="310" rx="28" fill="#FFFFFF" stroke="#CBD5E1"/><text x="680" y="354" font-size="22" font-weight="800" fill="#0F172A">Load and adaptation trace</text><path d="M700 540C760 500 800 520 850 470C905 416 965 454 1020 392C1060 350 1110 380 1130 340" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M700 570C768 558 815 532 860 546C920 566 970 505 1020 520C1062 533 1104 485 1130 500" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none"/><rect x="690" y="388" width="150" height="38" rx="19" fill="#F5F3FF"/><text x="712" y="413" font-size="15" font-weight="700" fill="#6D28D9">guided mode</text><rect x="860" y="388" width="160" height="38" rx="19" fill="#ECFDF5"/><text x="884" y="413" font-size="15" font-weight="700" fill="#047857">focus mode</text>
  </g>
