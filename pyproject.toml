[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-interface-cognitive-load-lab"
version = "0.1.0"
description = "Academic HCI prototype for cognitive-load-aware adaptive AI interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hira Khyzer"}]
keywords = ["HCI", "human-centered AI", "adaptive interfaces", "cognitive load", "usability"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
